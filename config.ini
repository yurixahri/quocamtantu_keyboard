; Cấu hình Quốc Âm Tân Tự (QATT)

[hotkey]
; Phím bổ trợ: Alt, Ctrl, Shift, Win (kết hợp bằng dấu +, ví dụ: Alt, Ctrl+Shift, Alt+Shift)
modifiers = Alt
; Phím chính: A-Z, 0-9, F1-F12, Space, ` (Tilde)
key = Z

[sound]
; 1: bật âm thanh thông báo khi chuyển chế độ, 0: tắt
enabled = 1

[game]
; Tự động phát hiện game để không chặn phím di chuyển WASD / kỹ năng (1: bật, 0: tắt)
auto_detect = 1
; Tự động phát hiện ứng dụng toàn màn hình không viền (1: bật, 0: tắt)
fullscreen_detect = 1
; Danh sách file thực thi của game cần loại trừ (phân cách bằng dấu phẩy)
exclude_apps = League of Legends.exe, cs2.exe, csgo.exe, Dota2.exe, GenshinImpact.exe, Valorant.exe, GTA5.exe, Minecraft.exe, javaw.exe, RobloxPlayerBeta.exe, Naraka.exe, OverWatch.exe, FortniteClient-Win64-Shipping.exe, r5apex.exe, TslGame.exe
